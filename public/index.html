<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    input { flex: 1; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.9rem; }
    input:focus { outline: 2px solid #6366f1; border-color: transparent; }
    button { padding: 0.5rem 1rem; background: #6366f1; color: #fff; border: none; border-radius: 6px; font-size: 0.9rem; cursor: pointer; }
    button:hover { background: #4f46e5; }
    #notes { display: flex; flex-direction: column; gap: 0.5rem; }
    .note { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; }
    .note-title { font-weight: 500; font-size: 0.9rem; }
    .note-body { font-size: 0.8rem; color: #6b7280; margin-top: 0.2rem; }
    .del { background: none; color: #9ca3af; border: none; font-size: 1rem; cursor: pointer; padding: 0.2rem 0.4rem; border-radius: 4px; }
    .del:hover { background: #fee2e2; color: #dc2626; }
    #status { font-size: 0.8rem; color: #6b7280; margin-bottom: 1rem; }
    .empty { color: #9ca3af; font-size: 0.9rem; text-align: center; padding: 2rem; }
  </style>
</head>
<body>
  <h1>Notes</h1>
  <p id="status">Loading…</p>
  <form id="form">
    <input id="title" placeholder="Title" required />
    <input id="body" placeholder="Body (optional)" />
    <button type="submit">Add</button>
  </form>
  <div id="notes"></div>

  <script>
    const statusEl = document.getElementById('status');
    const notesEl = document.getElementById('notes');

    async function load() {
      const res = await fetch('/api/notes');
      const notes = await res.json();
      statusEl.textContent = `${notes.length} note${notes.length !== 1 ? 's' : ''}`;
      notesEl.innerHTML = notes.length
        ? notes.map(n => `
            <div class="note">
              <div>
                <div class="note-title">${esc(n.title)}</div>
                ${n.body ? `<div class="note-body">${esc(n.body)}</div>` : ''}
              </div>
              <button class="del" onclick="del(${n.id})">×</button>
            </div>`).join('')
        : '<div class="empty">No notes yet</div>';
    }

    async function del(id) {
      await fetch(`/api/notes/${id}`, { method: 'DELETE' });
      load();
    }

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const body = document.getElementById('body').value.trim();
      if (!title) return;
      await fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, body }),
      });
      e.target.reset();
      load();
    });

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    load();
  </script>
</body>
</html>
